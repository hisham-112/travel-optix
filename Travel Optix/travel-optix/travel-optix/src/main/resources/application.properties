# =============================================
# TRAVEL OPTIX - APPLICATION PROPERTIES
# =============================================

# App Name
spring.application.name=travel-optix

# =============================================
# POSTGRESQL DATABASE CONNECTION
# =============================================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/travel_optix_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / HIBERNATE SETTINGS
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# SERVER PORT
# =============================================
server.port=${PORT:8080}
# =============================================
# APP NAME FOR JWT LATER
# =============================================
app.name=Travel Optix
app.version=1.0.0

# =============================================
# JWT SETTINGS
# =============================================
app.jwt.secret=traveloptix2025supersecretjwtkey1234567890abcdef
app.jwt.expiration=86400000


# ✅ Brevo SMTP
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=kwamekarikari2006@gmail.com
app.mail.from-name=Travel Optix

