# =============================================
# TRAVEL OPTIX - APPLICATION PROPERTIES
# =============================================

# App Name
spring.application.name=travel-optix

# =============================================
# POSTGRESQL DATABASE CONNECTION
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/travel_optix_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / HIBERNATE SETTINGS
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# SERVER PORT
# =============================================
server.port=8080

# =============================================
# APP NAME FOR JWT LATER
# =============================================
app.name=Travel Optix
app.version=1.0.0

# =============================================
# JWT SETTINGS
# =============================================
app.jwt.secret=traveloptix2025supersecretjwtkey1234567890abcdef
app.jwt.expiration=86400000
